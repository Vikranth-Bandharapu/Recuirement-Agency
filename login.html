<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Stackly Recruitment Portal - Admin Dashboard or Recruiter Workspace.">
  <title>Login | Stackly Recruitment Agency</title>

  <!-- Open Graph / Meta Tags for Social & Chat Link Previews -->
  <meta property="og:title" content="Login | Stackly Recruitment Agency">
  <meta property="og:description" content="Login to Stackly Recruitment Portal - Admin Dashboard or Recruiter Workspace.">
  <meta property="og:image" content="assets/logo.webp">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stackly Recruitment Agency">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Login | Stackly Recruitment Agency">
  <meta name="twitter:description" content="Login to Stackly Recruitment Portal - Admin Dashboard or Recruiter Workspace.">
  <meta name="twitter:image" content="assets/logo.webp">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/responsive.css">
</head>
<body style="background: linear-gradient(135deg, #0B0F19 0%, #111827 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">

  <main style="width: 100%; display: flex; align-items: center; justify-content: center;">
    <div class="container container-narrow" style="max-width: 360px; padding: 0;">
      
      <!-- Top Back to Home Button -->
      <div style="margin-bottom: 1rem;">
        <a href="index.html" class="btn btn-outline btn-sm" style="color: #FFFFFF; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); padding: 0.4rem 0.75rem; font-size: 0.85rem;">
          <i class="fa-solid fa-arrow-left"></i> Back
        </a>
      </div>

      <div class="card" style="padding: 1.5rem 1.25rem; background-color: #FFFFFF; border-radius: var(--radius-lg); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);">
        <div class="text-center" style="margin-bottom: 1.5rem;">
          <a href="index.html" class="brand-logo" style="display: inline-block; margin-bottom: 1rem;">
            <img src="assets/logo.webp" alt="Stackly Logo" class="brand-logo-img" style="height: 36px;">
          </a>
          <h1 class="section-title" style="font-size: 1.5rem; margin-top: 0;">Sign In</h1>
          <p class="section-description" style="font-size: 0.85rem; margin-bottom: 0;">Access your workspace.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" style="font-size: 0.85rem;">Dashboard Role *</label>
            <select class="form-control" name="login-role" style="padding: 0.5rem 0.75rem; font-size: 0.9rem;" required>
              <option value="Admin">Agency Admin</option>
              <option value="Recruiter">Senior Recruiter</option>
            </select>
          </div>

          <div class="form-group">
            <label for="login-email" class="form-label">Email Address *</label>
            <input type="email" id="login-email" class="form-control" placeholder="admin@stackly.com" required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password *</label>
            <div style="position: relative;">
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
              <button type="button" class="password-toggle-btn" aria-label="Toggle Password Visibility" style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password is required.</div>
          </div>



          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
          </button>
        </form>

        <div class="text-center" style="margin-top: 1.75rem; font-size: 0.95rem; color: var(--text-muted);">
          Don't have a portal account? <a href="signup.html" style="color: var(--primary-blue); font-weight: 700;">Sign Up Here</a>
        </div>

        <div class="text-center" style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border-light);">
          <a href="index.html" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;">
            <i class="fa-solid fa-house"></i> Return to Homepage
          </a>
        </div>

      </div>
    </div>
  </main>

  <script src="assets/main.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/validation.js"></script>
</body>
</html>
