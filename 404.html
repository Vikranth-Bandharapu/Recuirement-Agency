<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page Not Found - Stackly Recruitment Agency. Return to Home or explore our recruitment services.">
  <title>404 Page Not Found | Stackly Recruitment Agency</title>

  <!-- Open Graph / Meta Tags for Social & Chat Link Previews -->
  <meta property="og:title" content="404 Page Not Found | Stackly Recruitment Agency">
  <meta property="og:description" content="Page Not Found - Stackly Recruitment Agency. Return to Home or explore our recruitment services.">
  <meta property="og:image" content="assets/logo.webp">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stackly Recruitment Agency">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/responsive.css">
</head>
<body style="background: linear-gradient(135deg, #0B0F19 0%, #111827 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">

  <!-- Main Standalone 404 Container (No Header, No Footer) -->
  <main class="error-page-section" style="width: 100%; min-height: auto; padding: 0; background: transparent;">
    <div class="container container-narrow" style="max-width: 680px;">
      <div class="error-card card-3d margin-center" style="margin: 0 auto; padding: 4rem 3rem; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-radius: var(--radius-lg); box-shadow: var(--shadow-3d); border: 1px solid rgba(255, 255, 255, 0.8);">
        
        <a href="index.html" class="brand-logo text-center" style="justify-content: center; margin-bottom: 2rem;">
          <img src="assets/logo.webp" alt="Stackly Logo" class="brand-logo-img">
        </a>

        <div class="error-badge" style="font-size: 6rem; font-weight: 900; line-height: 1;">404</div>
        <h1 class="error-title" style="font-size: 2.25rem; font-weight: 900; color: var(--text-dark); margin-bottom: 1rem;">Requisition Not Found</h1>
        <p class="error-desc" style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.7;">The job requisition, candidate profile, or page you are attempting to reach has been filled, moved, or does not exist on our server.</p>

        <div class="error-actions" style="margin-bottom: 2.5rem; display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap;">
          <a href="index.html" class="btn btn-primary btn-lg">
            <i class="fa-solid fa-house"></i> Back to Home
          </a>
          <button onclick="history.back();" class="btn btn-outline btn-lg">
            <i class="fa-solid fa-arrow-left"></i> Go Back
          </button>
        </div>



      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/main.js"></script>
  <script src="assets/animations.js"></script>
</body>
</html>
